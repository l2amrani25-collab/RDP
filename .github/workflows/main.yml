name: RDP with Tailscale (Minimal)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force
          Restart-Service TermService

      - name: Create User
        shell: powershell
        run: |
          $pw = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
          New-LocalUser rdpuser -Password $pw
          Add-LocalGroupMember Administrators rdpuser
          Add-LocalGroupMember "Remote Desktop Users" rdpuser

      - name: Install Tailscale
        shell: powershell
        run: |
          iwr https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi -OutFile ts.msi
          Start-Process msiexec "/i ts.msi /quiet" -Wait

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}

          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

      - name: Short wait (anti-kill)
        shell: powershell
        run: |
          Start-Sleep -Seconds 480   # 8 minutes MAX
